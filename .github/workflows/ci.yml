name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o código. Nenhum segredo é usado.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BACK END
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Testes (domínio, API e segurança)
        run: mvn -B -ntp verify
      - name: Testes 1 e 2 do enunciado (saída formatada)
        run: java -cp target/classes com.treebom.domain.Demo

  frontend:
    name: FRONT END
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilidades das dependências
        run: npm audit
