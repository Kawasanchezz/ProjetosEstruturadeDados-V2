name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o workflow só lê o código. Nenhum segredo é usado.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências (com verificação de hash)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.in
      - name: Testes
        run: python -m pytest -q
      - name: Testes 1 e 2 do enunciado (saída formatada)
        run: python -X utf8 -m app.demo
      - name: Análise estática (bandit)
        run: python -m bandit -r app -q
      - name: Vulnerabilidades das dependências
        run: python -m pip_audit -r requirements.txt --require-hashes

  frontend:
    name: Frontend (tsc, vitest, build, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilidades das dependências
        run: npm audit
